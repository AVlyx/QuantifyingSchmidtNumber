[project]
name = "QuantifyingSchmidtNumber"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "qics",
    "bound-entangled",
    "pydantic",
    "tqdm",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SDP_utils", "notebook_utils"]

[project.optional-dependencies]
dev = ["ipykernel", "matplotlib", "jupyter"]
