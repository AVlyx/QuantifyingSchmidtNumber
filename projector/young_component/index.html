<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        padding: 4px;
        background: transparent;
      }

      .grid {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .row-label {
        width: 24px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 6px;
        font-size: 13px;
        font-weight: 500;
        color: #555;
        flex-shrink: 0;
        font-family: monospace;
      }

      .cell {
        width: 40px;
        height: 40px;
        border: 2px solid #444;
        border-radius: 3px;
        cursor: pointer;
        transition: filter 0.08s;
      }
      .cell:hover {
        filter: brightness(0.8);
      }
      .cell.filled {
        background: #a8f0b0;
      }
      .cell.empty {
        background: #e8e8e8;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>

    <script>
      // ── Render ──────────────────────────────────────────────────────────────────

      function render(frame, rows, cols, labels, filledColor) {
        const color = filledColor || "#a8f0b0";
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        for (let r = 0; r < rows; r++) {
          const rowEl = document.createElement("div");
          rowEl.className = "row";

          if (labels && labels[r] != null) {
            const label = document.createElement("span");
            label.className = "row-label";
            label.textContent = String(labels[r]);
            rowEl.appendChild(label);
          }

          for (let c = 0; c < cols; c++) {
            const cell = document.createElement("div");
            const filled = c < (frame[r] ?? 0);
            cell.className = "cell " + (filled ? "filled" : "empty");
            if (filled) cell.style.background = color;
            cell.addEventListener("click", () => sendClick(r, c + 1));
            rowEl.appendChild(cell);
          }

          grid.appendChild(rowEl);
        }

        setFrameHeight();
      }

      // ── Streamlit messaging ─────────────────────────────────────────────────────

      let _seq = 0;

      function sendClick(row, col) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: [row, col, ++_seq], dataType: "json" },
          "*",
        );
      }

      function setFrameHeight() {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: document.body.scrollHeight },
          "*",
        );
      }

      function ready() {
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
      }

      // ── Bootstrap ───────────────────────────────────────────────────────────────

      window.addEventListener("message", (event) => {
        if (event.data.type === "streamlit:render") {
          const args = event.data.args;
          const rows = args.rows ?? 10;
          const cols = args.cols ?? 10;
          render(
            args.frame ?? Array(rows).fill(0),
            rows,
            cols,
            args.labels ?? null,
            args.color ?? null,
          );
        }
      });

      ready();
    </script>
  </body>
</html>
